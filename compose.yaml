services:
  ollama:
    image: ollama/ollama:0.32.15
    ports:
      - 11434:11434
    volumes:
      - ./ollama/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - 18080:8080
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  node:
    build:
      context: .
      dockerfile: ./dockerfiles/node/Dockerfile
    volumes:
      - ./projects/node:/home/node/project
    ports:
      - 13000:3000
    tty: true
    stdin_open: true
    working_dir: /home/node/project/
    command: npm run dev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"